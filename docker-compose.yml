# School_Timetable_Fresh — shared droplet: APP_PORT (default 8090) → container :80 (8080 = Jenkins on host)
# Output is baked into the image (replace on each image build). No output volume —
# avoids stale files masking a new deploy. See Deploy/SHARED_DROPLET_PLAN.md

name: school-timetable

services:

  school-timetable:

    image: ${IMAGE_NAME:-school-timetable-fresh}:${IMAGE_TAG:-latest}

    container_name: school-timetable-fresh

    restart: unless-stopped

    ports:
      - "${APP_PORT:-8090}:80"

    environment:
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:80/health"
        ]

      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - timetable-network

    labels:
      - "app=school-timetable-fresh"
      - "project=school-timetable"
      - "tier=application"


networks:

  timetable-network:
    driver: bridge
    name: school_timetable_network
